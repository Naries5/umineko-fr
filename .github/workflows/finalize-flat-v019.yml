name: Finalize verified flat v0.1.19

on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_flat_v019.py'
      - '.github/workflows/finalize-flat-v019.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify uploaded ZIP, publish release, switch manifest last
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/finalize_flat_v019.py
