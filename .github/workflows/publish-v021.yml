name: Publish Umineko FR v0.1.21 Questions and 16 images
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v021.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: umineko-v021-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing release 442754341 and downloaded archives without rebuilding
        run: python3 tools/publish_v021.py verify
      - name: Publish verified existing release by ID
        run: python3 tools/publish_v021.py publish
      - name: Activate manifest only after published assets are verified
        run: python3 tools/publish_v021.py activate
